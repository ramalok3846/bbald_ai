name = "bbald-ai"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

# ramalok.kr 이 Cloudflare 네임서버로 연결되어 있다면, Workers 배포 후
# Cloudflare 대시보드 > Workers & Pages > bbald-ai > Settings > Domains & Routes 에서
# 원하는 서브도메인(예: bbald.ramalok.kr)을 연결하면 된다.
#
# [[routes]]
# pattern = "bbald.ramalok.kr/*"
# zone_name = "ramalok.kr"
