name = "bbald-ai"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
# 배포 환경의 wrangler(v3)는 run_worker_first에 경로 배열을 아직 지원하지 않고
# boolean만 받는다 ("Expected assets.run_worker_first to be of type boolean" 에러).
# true로 두면 모든 요청이 일단 Worker로 오고, worker.js가 /api/* 가 아니면
# env.ASSETS.fetch(request)로 정적 파일을 대신 서빙한다 (동작은 동일).
run_worker_first = true
# Cloudflare Assets 기본 동작(auto-trailing-slash)은 "/admin.html" 요청을
# "/admin"으로 308 리다이렉트한다. 그 Location이 PaLhomepage의 리버스 프록시를
# 거쳐 브라우저로 그대로 전달되면, 브라우저는 그걸 ramalok.kr 기준 상대경로로
# 풀어서 "https://www.ramalok.kr/admin"으로 이동하는데, 그 경로는 메인 사이트
# 미들웨어가 관리자 서브도메인 전용으로 막아둬서 "관리자 페이지가 안 열리는"
# 문제가 생겼다. 자동 리다이렉트를 꺼서 요청한 경로를 그대로 서빙하게 한다.
html_handling = "none"

[ai]
binding = "AI"

# 하루 사용량 제한(악용/과금 방지)에 쓰는 KV 네임스페이스. (src/rate-limit.js 참고)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b73742bb2a6d4515b648550622f3550f"

# ramalok.kr 이 Cloudflare 네임서버로 연결되어 있다면, Workers 배포 후
# Cloudflare 대시보드 > Workers & Pages > bbald-ai > Settings > Domains & Routes 에서
# 원하는 서브도메인(예: bbald.ramalok.kr)을 연결하면 된다.
#
# [[routes]]
# pattern = "bbald.ramalok.kr/*"
# zone_name = "ramalok.kr"
